[project]
name = "wfa-backend"
version = "0.1.0"
description = "WoW Forever Armory & Competitive Analytics - API, parser de combat logs y worker"
requires-python = ">=3.12"
authors = [{ name = "Luciano Colalunga" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.1",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert en tests
  "B008",   # Depends() en defaults es el idioma de FastAPI
  "RUF001", "RUF002", "RUF003",  # textos en español con caracteres ambiguos
  "UP046",  # Generic de Pydantic: se mantiene la sintaxis clásica
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"app/demo/**" = ["S311"]  # datos sintéticos: random determinista, no criptográfico

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requiere PostgreSQL (DATABASE_URL)",
]
