name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tipos, migraciones, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wfa
          POSTGRES_PASSWORD: wfa
          POSTGRES_DB: wfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wfa" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://wfa:wfa@localhost:5432/wfa
      TEST_DATABASE_URL: postgresql+psycopg://wfa:wfa@localhost:5432/wfa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: ruff format --check app tests scripts
      - run: mypy app
      - name: Migraciones (ida, vuelta e ida)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Base de tests
        run: PGPASSWORD=wfa psql -h localhost -U wfa -d wfa -c "CREATE DATABASE wfa_test;"
      - run: pytest -q --cov=app --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (lint, tipos, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wfa
          POSTGRES_PASSWORD: wfa
          POSTGRES_DB: wfa_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wfa" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
      - working-directory: frontend
        env:
          E2E_PYTHON: python
          E2E_DATABASE_URL: postgresql+psycopg://wfa:wfa@localhost:5432/wfa_e2e
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
